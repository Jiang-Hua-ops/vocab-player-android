name: Build and test Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-test
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.echo.vocabplayer/.MainActivity | tee launch.txt
            grep -q "Status: ok" launch.txt
            sleep 2
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            grep -q "英语单词播放器" window.xml
      - uses: actions/upload-artifact@v4
        with:
          name: vocab-player-apk-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
